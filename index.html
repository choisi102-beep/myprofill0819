<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자기소개</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Sans KR & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans KR', 'Inter', sans-serif;
        }
        /* Smooth fade-in animation on load */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in {
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased relative overflow-hidden">

    <!-- Ambient Background Glows for visual depth -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-sky-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Central Profile Card Container -->
    <main class="w-full max-w-md bg-slate-800/80 backdrop-blur-md border border-slate-700/60 rounded-3xl p-8 md:p-10 shadow-2xl animate-fade-in text-center relative z-10">
        
        <!-- 1. 프로필 사진 -->
        <div class="relative w-32 h-32 mx-auto mb-6">
            <img 
                src="my photo.png" 
                alt="프로필 사진" 
                class="w-full h-full object-cover rounded-full border-4 border-slate-700 shadow-md ring-2 ring-indigo-500/50"
                onerror="this.onerror=null; this.src='https://placehold.co/160x160/334155/F8FAFC?text=Profile';"
            />
        </div>

        <!-- 2. 이름 -->
        <h1 class="text-2xl md:text-3xl font-bold text-white tracking-tight mb-2">
            최시열
        </h1>

        <!-- 3. 한 줄 소개 -->
        <p class="text-indigo-400 font-medium text-sm md:text-base mb-6">
            재미있는 사람
        </p>

        <!-- Divider line -->
        <div class="w-12 h-0.5 bg-slate-700 mx-auto mb-6 rounded-full"></div>

        <!-- 4. 짧은 자기소개 -->
        <div class="text-slate-300 text-sm md:text-base leading-relaxed space-y-2 text-center break-keep">
            <p>
                여행과 마라톤 그리고 수영을 좋아하는 사람
            </p>
        </div>

    </main>

</body>
</html>
